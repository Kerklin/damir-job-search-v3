# damir-job-search — single workflow, no AI.
# All jobs: runs-on ubuntu-24.04 (no ubuntu-latest -> Ubuntu 26 notice).
# Only Node.js 24 actions: checkout@v5, upload-artifact@v7, deploy-pages@v5.
# The dashboard is deployed here, so GitHub's built-in "pages build and deployment"
# workflow (Node 20 actions, ubuntu-latest) is no longer used.
# Requires: Settings -> Pages -> Source: GitHub Actions.
name: job-search

on:
  schedule:
    - cron: "15 6 * * *"          # daily scrape + ranking (06:15 UTC)
  workflow_dispatch:
    inputs:
      task:
        description: "Task to run"
        type: choice
        options: [daily, setup, dashboard, test]
        default: setup
  issues:
    types: [opened, edited, labeled]
  push:
    branches: [main]
    paths-ignore: ["data/**", "docs/**", "applications/**"]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: job-search
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Privacy check and self-test
        run: |
          python3 jobsearch.py check
          python3 jobsearch.py test

      - name: Run task
        env:
          GH_TOKEN: ${{ github.token }}
          RELIEFWEB_APPNAME: ${{ vars.RELIEFWEB_APPNAME }}
          EVENT_NAME: ${{ github.event_name }}
          TASK: ${{ inputs.task }}
        run: python3 jobsearch.py ci

      - name: Save results
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes to save"; exit 0; fi
          git commit -m "job-search: ${{ github.event_name }} [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

      # Same artifact format as actions/upload-pages-artifact (artifact "github-pages"
      # holding artifact.tar), built with tar + upload-artifact@v7 (Node.js 24).
      - name: Package dashboard
        run: |
          mkdir -p docs
          [ -f docs/index.html ] || python3 jobsearch.py dashboard
          tar --dereference --hard-dereference --directory docs -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .

      - name: Upload dashboard
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
